# The server is the LAN time authority (plan §3.4). Offline, it has no upstream to
# discipline against, so it serves its own clock. Tablets reach it because the router's
# dnsmasq maps the Android NTP hostname (time.android.com / *.pool.ntp.org) to STATIC_IP.
#
# Serve time to the LAN even with no synced upstream source:
local stratum 10
# Allow the LAN subnet to query (adjust to your subnet):
allow 192.168.8.0/24
# If the site ever has upstream internet NTP, chrony will use it; harmless offline.
