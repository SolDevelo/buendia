# Buendia field-pilot server — kernel settings. Installed by setup.sh as
# /etc/sysctl.d/60-buendia.conf.

# Let a socket bind an address this machine does not hold at that moment.
#
# The stack publishes its ports on the server's LAN address only (LAN_BIND in .env), so that a
# laptop joined to a third-party Wi-Fi does not also serve patient data to that network. The
# cost of binding an address rather than 0.0.0.0 is that the address has to EXIST when the
# container starts: Docker fails with "cannot assign requested address" otherwise. On a laptop
# the wired address goes away whenever the cable is out, so a reboot with the cable unplugged
# would leave the whole stack down — the one failure a field server cannot afford, and one
# nobody on site could diagnose.
#
# With this set, the containers start regardless and begin answering the moment the cable is
# back. It widens nothing: a bound address still only receives traffic that is actually routed
# to this machine.
net.ipv4.ip_nonlocal_bind = 1
