# Buendia field-pilot server stack. Both services share UTC (fixes bug 1).
# Started by ../setup.sh via: docker compose --env-file ../.env up -d
services:
  db:
    # DB_IMAGE is mysql:5.6 with the ~83 MB baseline seed BAKED IN (../seed/build-db-image.sh),
    # so a site server gets the whole heavy part of the deployment from `docker pull` and needs
    # no seed file copied onto it. Falls back to MYSQL_IMAGE for older .env files — but a bare
    # mysql image has no baseline seed, and setup.sh fails the run if that combination is used.
    image: ${DB_IMAGE:-${MYSQL_IMAGE:-mysql:5.6}}
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      TZ: ${TZ}
    command:
      - --default-time-zone=+00:00      # MySQL in UTC (bug 1)
      - --character-set-server=utf8
      - --collation-server=utf8_general_ci
      - --skip-log-bin                  # binlog off — single-server pilot, snapshot backups (§3.1)
      - --skip-name-resolve             # never reverse-resolve a connecting client: DNS_SERVERS points
                                        #   at the router, so without this every app->DB connection stalls
                                        #   while the router reboots (5.6 has no such default)
    volumes:
      - db_data:/var/lib/mysql
      # SINGLE FILE, not the directory. The baseline seed (10-buendia-base.sql) is baked into
      # DB_IMAGE; mounting the whole ../seed/initdb directory here would SHADOW it and leave the
      # DB with no schema and no concepts. Only the small, hand-edited site seed is mounted, so
      # locations/accounts stay tailorable without rebuilding or re-pushing the image.
      # (mysql runs initdb.d/*.sql alphabetically, first boot only: 10- baked, then 20- mounted.)
      - ../seed/initdb/20-buendia-site.sql:/docker-entrypoint-initdb.d/20-buendia-site.sql:ro
    healthcheck:
      # Gate on the REAL server over TCP with a real query as the app user — NOT `mysqladmin ping`,
      # which passes during MySQL's init-phase (socket-only) temp server and lets OpenMRS start
      # before the DB is truly ready (→ DatabaseUpdater "Unable to get a connection").
      test: ["CMD-SHELL", "mysql -h127.0.0.1 --protocol=TCP -u$$MYSQL_USER -p\"$$MYSQL_PASSWORD\" -e 'SELECT 1' $$MYSQL_DATABASE >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 180s

  openmrs:
    image: ${OPENMRS_IMAGE}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      # The image entrypoint renders openmrs-runtime.properties from these (verified working).
      DB_HOST: db
      DB_DATABASE: ${MYSQL_DATABASE}
      DB_USERNAME: ${MYSQL_USER}
      DB_PASSWORD: ${MYSQL_PASSWORD}
      TZ: ${TZ}
      JAVA_OPTS: "-Duser.timezone=UTC"   # JVM in UTC (bug 1)
    ports:
      # Stays 9000 for every real deployment (the APK bakes in http://<server>:9000).
      # Parameterized only so a THROWAWAY stack can be booted alongside a running one to
      # validate a seed/config change without disturbing it:
      #   OPENMRS_PORT=9100 PKGSERVER_PORT=9101 docker compose -p throwaway --env-file ../.env up -d
      #
      # LAN_BIND is WHICH ADDRESS the port is published on, and it is a data-protection
      # control, not a tuning knob. The pilot server laptop takes its internet by joining a
      # third-party Wi-Fi itself (site Wi-Fi, MSF corporate, a phone hotspot), so the moment it
      # does, a port published on 0.0.0.0 is reachable by everyone on THAT network — this one
      # serves patient data behind a single well-known account. Set LAN_BIND=<STATIC_IP> (the
      # site .env does) and the tablets still reach it while the foreign network cannot.
      # Unset = 0.0.0.0 = the old behaviour, which is what local dev and throwaway stacks want.
      #
      # ⚠️ CONSEQUENCE FOR SUPPORT, and it is not obvious: once LAN_BIND is set, this port no
      # longer answers on 127.0.0.1. Remote support for the pilot is TeamViewer — a desktop ON
      # this laptop — where http://localhost:9000/openmrs is the natural thing to type, and it
      # will HANG rather than refuse (the packet leaves for the default route and is dropped),
      # which reads exactly like a dead server. The supported address, on the laptop and on a
      # tablet alike, is http://<STATIC_IP>:9000/openmrs. One address everywhere: the same one
      # on the in-zone card, in the APK, and in the runbooks.
      # A second "127.0.0.1:9000:8080" mapping was considered and rejected: it cannot be
      # expressed here so that it also works with LAN_BIND unset — docker then refuses the
      # stack outright with `Bind for 0.0.0.0:9000 failed: port is already allocated` (verified),
      # which would break local development and the throwaway-stack workflow to buy a
      # convenience alias on the one machine that already has the real address.
      - "${LAN_BIND:-0.0.0.0}:${OPENMRS_PORT:-9000}:8080"   # http://<STATIC_IP>:9000/openmrs
    volumes:
      - openmrs_profiles:/opt/openmrs/profiles   # persist uploaded profile CSVs across restarts
    healthcheck:
      # session endpoint returns 200 without auth (proves REST framework is up);
      # /ws/rest/buendia/patients would 401 (auth required) and flap the healthcheck.
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null",
              "http://localhost:8080/openmrs/ws/rest/v1/session"]
      interval: 30s
      timeout: 10s
      retries: 20
      start_period: 300s

  # Static file server for tablet APK install (QR code → http://<STATIC_IP>:9001/latest.apk)
  # and for the two paths the Android client probes on this port: buendia-client.json (the
  # update index) and /dists/stable/Release (its package-server health check — a 404 there
  # shows a "check package server configuration" snackbar on the tablet).
  # Content is produced by ../pkgserver/publish.sh; serving it is all this does.
  pkgserver:
    image: ${PKGSERVER_IMAGE:-nginx:alpine-slim}
    restart: unless-stopped
    ports:
      # The client derives the package URL as http://<server>:9001, so this should stay 9001.
      # LAN_BIND as above, and it matters MORE here than on 9000: the APK served from this port
      # carries the server password as a plain Android string resource, readable with one
      # `aapt dump --values resources`. A foreign network must never see this port.
      - "${LAN_BIND:-0.0.0.0}:${PKGSERVER_PORT:-9001}:80"
    volumes:
      - ../pkgserver/www:/usr/share/nginx/html:ro
      - ../pkgserver/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      # alpine-slim has no curl; busybox wget is present.
      # MUST be 127.0.0.1, not localhost: /etc/hosts maps localhost to ::1 as well, busybox
      # wget tries the IPv6 address first, and `listen 80` binds IPv4 only -> connection
      # refused -> the container reports unhealthy while serving traffic perfectly.
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/dists/stable/Release"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  db_data:
  openmrs_profiles:
