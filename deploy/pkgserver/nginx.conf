# Buendia package/APK server — mounted at /etc/nginx/conf.d/default.conf.
# Serves deploy/pkgserver/www/ read-only on :9001 (host) for tablet APK install.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Directory listing, so an operator can see what's published without a landing page.
    autoindex on;
    charset utf-8;

    # .apk is not in nginx's mime.types, so it would be served as the global default
    # (application/octet-stream). Set the real Android package type here instead of via a
    # server-level `types {}` block, which would REPLACE the inherited mime.types map
    # rather than add to it.
    # (nginx already advertises Accept-Ranges and honours Range for static files, so an
    # interrupted download over ward wifi can resume — nothing to add here.)
    location ~* \.apk$ {
        default_type application/vnd.android.package-archive;
    }

    # The update index the app polls (PackageServer.MODULE_NAME = "buendia-client").
    # Must not be cached: it is rewritten by publish.sh whenever a new APK is published.
    location = /buendia-client.json {
        default_type application/json;
        add_header Cache-Control "no-store";
    }

    # PackageServerHealthCheck probes this exact path and shows a "check package server
    # configuration" snackbar on the tablet if it 404s.
    location = /dists/stable/Release {
        default_type text/plain;
    }

    access_log /var/log/nginx/access.log;
}
